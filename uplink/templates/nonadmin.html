<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>DSA Case Viewer (Read-Only)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 24px auto; background:#fafafa; }
    fieldset { border: 1px solid #ddd; padding: 16px; margin-bottom: 24px; background:#fff; border-radius:8px; }
    .row { display: grid; grid-template-columns: 180px 1fr; gap: 10px; align-items: center; margin: 6px 0; }
    h2 { margin-top:0; }
    .case-card { border: 1px solid #ddd; border-radius:6px; background:#fff; padding:12px; margin-bottom:12px; }
    .case-card h3 { margin:0 0 4px; font-size:16px; }
    .small { color:#666; font-size:13px; }
    a.view-link { color:#4a90e2; text-decoration:none; }
    a.view-link:hover { text-decoration:underline; }
  </style>
</head>
<body>
<h2>DSA Assigned Cases</h2>
<h3 style="color:red;">Read-Only Mode — No Editing or Downloading</h3>

<!-- LOGIN -->
<fieldset>
  <legend>1) DSA Login</legend>
  <div class="row"><label>Username</label><input id="u" /></div>
  <div class="row"><label>Password</label><input id="p" type="password" /></div>
  <button id="btnLogin">Login</button>
  <div class="small" id="loginMsg">Login to view your assigned cases.</div>
</fieldset>

<!-- CASES -->
<fieldset>
  <legend>2) My Cases</legend>
  <div id="caseList">No cases loaded.</div>
</fieldset>

<!-- ITEMS -->
<fieldset>
  <legend>3) Case Files</legend>
  <div id="itemList">Select a case above.</div>
</fieldset>

<script>
let dsaToken=null;
let currentCaseId=null;

// ---- LOGIN ----
document.getElementById('btnLogin').onclick = async () => {
  const u=document.getElementById('u').value.trim();
  const p=document.getElementById('p').value;
  if(!u||!p) return alert("Enter username & password");
  const r=await fetch("/api/login/",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({username:u,password:p})
  });
  if(!r.ok) return alert("Login failed");
  const j=await r.json();
  dsaToken=j.token;
  document.getElementById('loginMsg').textContent="✅ Logged in.";
  loadCases();
};

// ---- LOAD USER'S ASSIGNED CASES ----
async function loadCases(){
  const r=await fetch("/api/list_user_cases/",{headers:{"Girder-Token":dsaToken}});
  if(!r.ok) return alert("Unable to load cases");
  const cases=await r.json();
  const list=document.getElementById("caseList");
  list.innerHTML="";
  if(!cases.length){ list.textContent="No assigned cases."; return; }
  cases.forEach(c=>{
    const div=document.createElement("div");
    div.className="case-card";
    div.innerHTML=`<h3>${c.name||"(Unnamed Case)"}</h3>
      <div class="small">ID: ${c._id}</div>
      <button data-id="${c._id}">View Files</button>`;
    list.appendChild(div);
  });
  list.querySelectorAll("button").forEach(btn=>{
    btn.onclick=()=>loadItems(btn.dataset.id);
  });
}

// ---- LOAD ITEMS IN A CASE ----
async function loadItems(caseId){
  currentCaseId=caseId;
  const r=await fetch(`${"/api/v1/item"}?folderId=${caseId}`,{
    headers:{"Girder-Token":dsaToken}
  });
  if(!r.ok) return alert("Failed to load items");
  const items=await r.json();
  const container=document.getElementById("itemList");
  container.innerHTML="";
  if(!items.length){ container.textContent="No slides found in this case."; return; }
  items.forEach(it=>{
    const a=document.createElement("a");
    a.href=`${window.location.origin.replace(/\/$/, "")}/#item/${it._id}`;
    a.target="_blank";
    a.textContent=it.name;
    a.className="view-link";
    const div=document.createElement("div");
    div.appendChild(a);
    container.appendChild(div);
  });
}
</script>
</body>
</html>
