<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Digital Slide Case Uploader</title>

  <link rel="stylesheet" href="https://cdn.webix.com/edge/webix.css">
  <script src="https://cdn.webix.com/edge/webix.js"></script>

  <style>
    html,body{
      height:100%;width:100%;margin:0;padding:0;
      background:#f5f6f7;font-family:"Inter",system-ui,sans-serif;
    }
    .main-container{
      display:flex;align-items:center;justify-content:center;height:100%;
    }
    .uploader-card{
      width:100%;max-width:880px;background:#fff;border-radius:16px;
      box-shadow:0 6px 20px rgba(0,0,0,0.08);padding:40px 50px;
    }
    h2{margin:0 0 8px;font-size:26px;font-weight:600;color:#0f172a;}

    #dropzone {
      border:2px dashed #14b8a6;
      border-radius:12px;
      background:#f9fafb;
      text-align:center;
      color:#475569;
      padding:50px 30px;
      cursor:pointer;
      transition:border-color .2s,background .2s;
    }
    #dropzone.webix_dropover {
      border-color:#10b981 !important;
      background:#ecfeff !important;
    }

    /* Filter bar */
    #filterBar{
      margin-top:12px;
      font-size:14px;
      color:#475569;
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:10px;
    }
    #filterBar span.label{
      font-weight:500;
    }
    #filterBar label{
      display:flex;
      align-items:center;
      gap:4px;
      cursor:pointer;
      font-size:13px;
      color:#374151;
    }

    /* Card container around file list */
    .file-container-card{
      margin-top:16px;
      border-radius:12px;
      background:#f9fafb;
      border:1px solid #e5e7eb;
      padding:12px 12px 4px 12px;
      max-height:360px;
      overflow-y:auto;
    }

    #fileList { margin-top:4px; }
    .file-block {
      border:1px solid #e5e7eb;border-radius:10px;
      padding:12px 16px;margin-bottom:10px;background:#fafafa;
      transition:background .15s,border-color .15s;
    }
    .file-block:hover{
      background:#fefce8;
      border-color:#facc15;
    }
    .file-header{
      display:flex;justify-content:space-between;align-items:center;
      margin-bottom:4px;
    }
    .file-name{font-weight:600;color:#0f172a;}
    .file-meta{
      display:flex;
      align-items:center;
      gap:6px;
    }
    .file-size{font-size:13px;color:#6b7280;margin-right:8px;}
    .status-text{font-size:13px;font-weight:600;margin-left:10px;}
    .status-ok { color:#16a34a; }
    .status-fail { color:#dc2626; }
    .delete-btn{cursor:pointer;color:#dc2626;font-weight:bold;font-size:20px;}
    .delete-btn:hover{color:#b91c1c;}

    .progress{height:6px;border-radius:3px;overflow:hidden;background:#e5e7eb;margin-top:6px;}
    .bar{height:100%;width:0;background:#14b8a6;transition:width .2s;}

    .btn {
      padding:10px 26px;font-size:15px;border:none;border-radius:8px;
      cursor:pointer;margin-right:10px;
    }
    #uploadDSABtn { background:#14b8a6;color:white; }
    #uploadS3Btn { background:#0ea5e9;color:white; }

    /* Tag pills */
    .file-tag{
      display:inline-flex;
      align-items:center;
      padding:2px 8px;
      border-radius:999px;
      font-size:11px;
      font-weight:600;
      border:1px solid transparent;
    }
    .tag-he{
      background:#eef2ff;
      border-color:#c7d2fe;
      color:#4338ca;
    }
    .tag-pdl1{
      background:#ecfeff;
      border-color:#a5f3fc;
      color:#0f766e;
    }
    .tag-pdl1-nc{
      background:#fef2f2;
      border-color:#fecaca;
      color:#b91c1c;
    }
  </style>
</head>

<body>
<div class="main-container">
  <div class="uploader-card">
    <h2>Digital Slide Case Uploader</h2>

    <div id="dropzone">📁 Drop slides here or click to choose files</div>

    <!-- Filter bar -->
    <div id="filterBar">
      <span class="label">Filter by label:</span>
      <label><input type="checkbox" class="tag-filter" value="H&E" checked> H&amp;E</label>
      <label><input type="checkbox" class="tag-filter" value="PDL-1" checked> PDL-1</label>
      <label><input type="checkbox" class="tag-filter" value="PDL-1 (NC)" checked> PDL-1 (NC)</label>
    </div>

    <!-- File list container card -->
    <div class="file-container-card">
      <div id="fileList"></div>
    </div>

    <div style="margin-top:20px;">
      <button class="btn" id="uploadDSABtn">Upload to DSA</button>
      <button class="btn" id="uploadS3Btn" disabled>Upload Case to S3</button>
    </div>

    <div id="statusMsg" style="margin-top:10px;font-weight:500;"></div>
  </div>
</div>


<script>
// -----------------------------------------------------
// CONFIG
// -----------------------------------------------------
const uploadDSAUrl = "http://127.0.0.1:8000/api/upload_case_files_dsa/";
const uploadS3Url  = "http://127.0.0.1:8000/api/upload_case_to_s3/";
let lastCaseName = null;

const realFiles = [];   // { id, file, label }
let activeTags = new Set(["H&E", "PDL-1", "PDL-1 (NC)"]);

// Upload run state for DSA
let currentBatch = null;     // id -> { xhr, done, success }
let batchTotal   = 0;
let completed    = 0;
let hadSuccess   = false;

// -----------------------------------------------------
// SMALL ERROR BANNER
// -----------------------------------------------------
function showError(msg){
  const s = document.getElementById("statusMsg");
  s.textContent = "❌ " + msg;
  s.style.color = "#dc2626";
}

// -----------------------------------------------------
// LABEL DETECTOR
// -----------------------------------------------------
function detectLabel(name){
  const n = name.toUpperCase();

  if (n.includes("PDL") || n.includes("PD-L") || n.includes("PD1") || n.includes("PD-1")) {
    if (n.includes("(NC)") || n.includes("-NC") || n.includes("_NC") || n.includes(" NC")) {
      return "PDL-1 (NC)";
    }
    return "PDL-1";
  }

  if (n.includes("H&E") || n.includes("H_E") || n.includes("HE.") || n.includes("-HE.") || n.endsWith("HE")) {
    return "H&E";
  }

  return "Unknown";
}

// -----------------------------------------------------
// TAG PILL RENDERING
// -----------------------------------------------------
function renderTag(label){
  let cls = "";
  if(label === "H&E") cls = "tag-he";
  else if(label === "PDL-1") cls = "tag-pdl1";
  else if(label === "PDL-1 (NC)") cls = "tag-pdl1-nc";

  if(label === "Unknown"){
    return "";
  }

  return `<span class="file-tag ${cls}">${label}</span>`;
}

// -----------------------------------------------------
// RENDER FILE BLOCK
// -----------------------------------------------------
function renderFileBlock(obj){
  const file = obj.file;
  const label = obj.label || "Unknown";

  const block = document.createElement("div");
  block.className = "file-block";
  block.id = "file-" + obj.id;
  block.dataset.label = label;

  block.innerHTML = `
    <div class="file-header">
      <div class="file-name">${file.name}</div>
      <div class="file-meta">
        ${renderTag(label)}
        <div class="file-size">${(file.size/1024/1024).toFixed(2)} MB</div>
        <div class="status-text" id="status-${obj.id}"></div>
        <div class="delete-btn" onclick="removeFile('${obj.id}')">&times;</div>
      </div>
    </div>
    <div class="progress"><div class="bar" id="bar-${obj.id}"></div></div>
  `;

  document.getElementById("fileList").appendChild(block);
  applyFilter();
}

// -----------------------------------------------------
// DSA STATUS HELPER
// -----------------------------------------------------
function updateDSAStatus(){
  if(!currentBatch) return;

  const status = document.getElementById("statusMsg");
  const uploadBtn = document.getElementById("uploadDSABtn");

  const currentIds = Object.keys(currentBatch);
  const total = currentIds.length;

  // Nothing left?
  if(total === 0){
    status.textContent = "Upload canceled (no files remaining).";
    status.style.color = "#6b7280";
    uploadBtn.disabled = false;
    currentBatch = null;
    return;
  }

  // Compute finished uploads
  const doneCount    = currentIds.filter(id => currentBatch[id].done).length;
  const successCount = currentIds.filter(id => currentBatch[id].success).length;

  // Still uploading
  if(doneCount < total){
    status.textContent = `⏳ Uploading to DSA... (${doneCount} / ${total})`;
    status.style.color = "#0f172a";
    return;
  }

  // All uploads finished
  if(successCount === total){
    status.textContent = "✅ Uploads finished to DSA.";
    status.style.color = "#16a34a";
  } else if(successCount > 0){
    status.textContent = "⚠️ Some files failed to upload.";
    status.style.color = "#f59e0b";
  } else {
    status.textContent = "❌ All uploads failed.";
    status.style.color = "#dc2626";
  }

  uploadBtn.disabled = false;
  currentBatch = null;
}


// -----------------------------------------------------
// DELETE FILE (FIXED COUNTER)
// -----------------------------------------------------
function removeFile(id){
  // 1. Remove from visual list
  const el = document.getElementById("file-" + id);
  if(el) el.remove();

  // 2. Remove from stored array
  const idx = realFiles.findIndex(f => f.id === id);
  if(idx !== -1) realFiles.splice(idx, 1);

  // --------- CASE A: NOT UPLOADING ---------
  if(!currentBatch){
    const status = document.getElementById("statusMsg");

    if(realFiles.length === 0){
      status.textContent = "";
      document.getElementById("uploadS3Btn").disabled = true;
    } else {
      status.textContent = `Ready (${realFiles.length} files)`;
      status.style.color = "#0f172a";
      document.getElementById("uploadS3Btn").disabled = false;
    }
    return;
  }

  // --------- CASE B: UPLOAD IN PROGRESS ---------
  // Equivalent to "cancel this file's upload"
  if(currentBatch[id]){
    // Abort the xhr if still running
    if(currentBatch[id].xhr && currentBatch[id].xhr.readyState !== 4){
      currentBatch[id].xhr.abort();
    }

    // Remove from batch tracking
    delete currentBatch[id];
  }

  // Recalculate batch total
  batchTotal = Object.keys(currentBatch).length;

  // If no files remain uploading → abort with clean message
  if(batchTotal === 0){
    const status = document.getElementById("statusMsg");
    status.textContent = "Upload canceled (no files remaining).";
    status.style.color = "#6b7280";
    document.getElementById("uploadDSABtn").disabled = false;
    currentBatch = null;
    completed = 0;
    return;
  }

  // Otherwise update the status correctly
  updateDSAStatus();
}

// -----------------------------------------------------
// FILTER LOGIC
// -----------------------------------------------------
function applyFilter(){
  const blocks = document.querySelectorAll(".file-block");
  blocks.forEach(block => {
    const label = block.dataset.label || "Unknown";
    block.style.display = activeTags.has(label) ? "" : "none";
  });
}

function setupFilterBar(){
  const checkboxes = document.querySelectorAll(".tag-filter");
  checkboxes.forEach(cb => {
    cb.addEventListener("change", () => {
      activeTags = new Set(
        Array.from(checkboxes)
          .filter(c => c.checked)
          .map(c => c.value)
      );
      applyFilter();
    });
  });
}
/* ------------------------------------------------------------
   SAFARI-SAFE DRAG & DROP (Webix NOT involved)
------------------------------------------------------------ */
const dropzone = document.getElementById("dropzone");
dropzone.onclick = () => { $$("uploader").fileDialog(); };

dropzone.addEventListener("dragover", e => {
  e.preventDefault();
  dropzone.classList.add("webix_dropover");
});

dropzone.addEventListener("dragleave", () => {
  dropzone.classList.remove("webix_dropover");
});

dropzone.addEventListener("drop", e => {
  e.preventDefault();
  dropzone.classList.remove("webix_dropover");

  const files = e.dataTransfer.files;
  if (!files || files.length === 0) return;

  for (const f of files) {
    if (f.size === 0) {
      showError(`Cannot add ${f.name} (0 bytes).`);
      continue;
    }
    const id = webix.uid().toString();
    const label = detectLabel(f.name);
    realFiles.push({ id, file: f, label });
    renderFileBlock({ id, file: f, label });
  }
});

/* ------------------------------------------------------------
   WEBIX UPLOADER — FILE DIALOG ONLY
   (Webix drag/drop is DISABLED)
------------------------------------------------------------ */
webix.ui({
  view: "uploader",
  id: "uploader",
  autosend: false,
  multiple: true,
  drop: false,     // <<< IMPORTANT: Webix will NOT intercept drops
  apiOnly: true,
  upload: false,

  on: {
    onBeforeFileAdd: function (item) {
      const f = item.file;
      if (!f || f.size === 0) return false;

      const id = webix.uid().toString();
      const label = detectLabel(f.name);

      realFiles.push({ id, file: f, label });
      renderFileBlock({ id, file: f, label });

      return false; // prevent Webix placeholder creation
    }
  }
});

// HARD BLOCK: Webix must NEVER create placeholders
$$("uploader").files.attachEvent("onBeforeAdd", () => false);

// -----------------------------------------------------
// UPLOAD TO DSA
// -----------------------------------------------------
document.getElementById("uploadDSABtn").onclick = function(){
  const status = document.getElementById("statusMsg");
  const uploadBtn = document.getElementById("uploadDSABtn");

  if(realFiles.length === 0){
    showError("No files selected.");
    return;
  }

  const filesToUpload = realFiles.slice();

  currentBatch = {};
  hadSuccess = false;
  batchTotal = filesToUpload.length;
  completed  = 0;

  filesToUpload.forEach(({id}) => {
    currentBatch[id] = { xhr: null, done: false, success: false };
  });

  // Reset per-file UI
  filesToUpload.forEach(({id}) => {
    const bar = document.getElementById("bar-"+id);
    const statusSpan = document.getElementById("status-"+id);
    if(bar){
      bar.style.width = "0%";
      bar.style.background = "#14b8a6";
    }
    if(statusSpan){
      statusSpan.textContent = "";
      statusSpan.classList.remove("status-ok","status-fail");
    }
  });

  uploadBtn.disabled = true;

  status.textContent = `⏳ Uploading to DSA... (0 / ${batchTotal})`;
  status.style.color = "#0f172a";

  filesToUpload.forEach(({id, file}) => {
    if (!currentBatch || !currentBatch[id]) {
      return;
    }

    const form = new FormData();
    form.append("file", file, file.name);

    const xhr = new XMLHttpRequest();
    currentBatch[id].xhr = xhr;

    xhr.open("POST", uploadDSAUrl, true);

    xhr.upload.onprogress = e => {
      if(e.lengthComputable){
        const bar = document.getElementById("bar-"+id);
        if(bar){
          const pct = (e.loaded / e.total) * 100;
          bar.style.width = pct + "%";
        }
      }
    };

    xhr.onreadystatechange = () => {
      if(xhr.readyState !== 4) return;
      if (!currentBatch || !currentBatch[id]) return;

      const entry = currentBatch[id];
      const statusSpan = document.getElementById("status-"+id);
      const bar = document.getElementById("bar-"+id);
      let resp = null;
      try { resp = JSON.parse(xhr.responseText); } catch(e) {}

      if (!entry.done) {
        entry.done = true;
        completed++;
      }

      if(xhr.status === 200 && resp && resp.status === "ok"){
        entry.success = true;
        hadSuccess = true;
        lastCaseName = resp.case;

        if(bar){
          bar.style.width = "100%";
          bar.style.background = "#16a34a";
        }
        if(statusSpan){
          statusSpan.textContent = "Uploaded";
          statusSpan.classList.add("status-ok");
        }
      } else {
        if(bar){
          bar.style.background = "#dc2626";
        }
        if(statusSpan){
          statusSpan.textContent = "Failed";
          statusSpan.classList.add("status-fail");
        }
      }

      updateDSAStatus();
    };

    xhr.send(form);
  });
};

// -----------------------------------------------------
// S3 EXPORT
// -----------------------------------------------------
function uploadFilesToS3(){
  const status = document.getElementById("statusMsg");

  if (realFiles.length === 0){
    showError("No files selected for S3 upload.");
    return;
  }

  status.textContent = "⏳ Uploading files to S3...";
  status.style.color = "#0f172a";

  let s3Completed = 0;
  let s3Success   = 0;
  const filesToUpload = realFiles.slice();

  filesToUpload.forEach(({id, file}) => {
    const form = new FormData();
    form.append("file", file, file.name);

    const xhr = new XMLHttpRequest();
    xhr.open("POST", uploadS3Url, true);

    xhr.onreadystatechange = () => {
      if (xhr.readyState !== 4) return;

      s3Completed++;
      let resp = null;
      try { resp = JSON.parse(xhr.responseText); } catch(e) {}

      if (xhr.status === 200 && resp && resp.status === "ok") {
        s3Success++;
      }

      if (s3Completed === filesToUpload.length){
        if (s3Success === s3Completed){
          status.textContent = "✅ All files uploaded to S3.";
          status.style.color = "#16a34a";
        } else if (s3Success > 0){
          status.textContent = "⚠️ Some files uploaded to S3, some failed.";
          status.style.color = "#f59e0b";
        } else {
          showError("All S3 uploads failed.");
        }
      }
    };

    xhr.send(form);
  });
}

document.getElementById("uploadS3Btn").onclick = function(){
  uploadFilesToS3();
};

// -----------------------------------------------------
// INIT
// -----------------------------------------------------
setupFilterBar();
document.getElementById("uploadS3Btn").disabled = false;
</script>




</body>
</html>
